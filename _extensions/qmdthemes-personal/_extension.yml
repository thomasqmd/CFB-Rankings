# GENERATED by qmdthemes -- do not edit
# Source: R/generate.R (build_extension_yml), R/scss.R, R/slides.R
# Regenerate: Rscript data-raw/build-tokens.R
# Edit the generator, not this file.

title: QMDThemes Personal
author: Thomas Reinke
version: 0.1.0
quarto-required: ">=1.4.0"
contributes:
  formats:
    html:
      theme:
        - cosmo
        - _qmd-typography.scss
        - _qmd-tables.scss
        - qmd-html.scss
        - _qmd-utilities.scss
        - _qmd-a11y.scss
        - _qmd-tokens-css.scss
        - _qmd-functions.scss
        - _qmd-tokens.scss
      highlight-style: a11y
      toc: true
      toc-depth: 3
      code-copy: hover
      embed-resources: true
      include-before-body:
        - brand-header.html
      include-after-body:
        - zoom.js
      execute:
        echo: false
        warning: false
        message: false
      knitr:
        opts_chunk:
          fig-format: svg
          dpi: 300
          comment: "#>"
          collapse: true

    revealjs:
      logo: _extensions/qmdthemes-personal/logos/TRlogo.svg
      theme:
        - default
        - _qmd-typography.scss
        - _qmd-tables.scss
        - qmd-revealjs.scss
        - _qmd-utilities.scss
        - _qmd-a11y.scss
        - _qmd-tokens-css.scss
        - _qmd-functions.scss
        - _qmd-tokens.scss
      # The slide box, in reveal's own coordinate space. Quarto reads these
      # before any stylesheet exists, so they cannot come from SCSS -- they
      # and the $qmd-slide-* tokens are generated from the same constants in
      # R/slides.R instead, which is what stops the caps in the stylesheet
      # from being measured against a box the deck no longer has.
      width: 1600
      height: 900
      # The share of the window reveal will not scale the slide into. The
      # slide counter is moved into that gutter by qmd-revealjs.scss, so this
      # has a floor: below 0.071 the counter climbs out of the top of
      # the window. qmd_slide_geometry() computes it, and the test suite
      # asserts this value clears it.
      margin: 0.08
      slide-number: c/t
      auto-animate: true
      embed-resources: true
      highlight-style: a11y
      center: false
      transition: fade
      execute:
        echo: false
        warning: false
        message: false
      knitr:
        opts_chunk:
          fig-format: svg
          # The slide, less the heading bar -- qmd_fig_dims("revealjs"), at
          # 100px to the inch. A figure on a slide of its own therefore binds
          # on width and fills the slide.
          fig-width: 16
          fig-height: 7.2
          dpi: 300
          comment: "#>"
          collapse: true

    pdf:
      pdf-engine: xelatex
      # Quarto defaults fig-pos to 'H', which with the float package means "set it
      # exactly here and never move it" -- so a figure that does not fit in the
      # space left on the page runs off the bottom instead of floating, and the
      # footer page number prints on top of it. Restoring normal LaTeX float
      # placement keeps figures near their text but lets one move when it cannot
      # fit.
      fig-pos: 'htbp'
      # Fonts are set in brand-preamble.tex, NOT here. Pandoc LaTeX-escapes the
      # values of mainfontoptions/sansfontoptions/monofontoptions, so a
      # Path=_extensions/... came out as Path=\_extensions/... and xelatex died
      # with "Missing \begin{document}" inside \setsansfont. The preamble is
      # raw LaTeX and is not escaped, so the paths survive intact there.
      fontsize: 11pt
      geometry:
        - top=0.75in
        - bottom=0.75in
        - left=1in
        - right=1in
        - footskip=0.3in
      include-in-header:
        - file: brand-preamble.tex
        - file: _macros.tex
        - file: defn.tex
      highlight-style: a11y
      toc: true
      toc-depth: 3
      number-sections: true
      execute:
        echo: false
        warning: false
        message: false
      knitr:
        opts_chunk:
          dev: "cairo_pdf"
          fig-format: pdf
          dpi: 300
          comment: "#>"
          collapse: true

    typst:
      # Atkinson Hyperlegible Next is bundled, not installed, so Typst cannot
      # find it by name -- it warned "unknown font family" and silently fell
      # back on every heading. This points Typst at the vendored copies.
      font-paths:
        - _extensions/qmdthemes-personal/fonts
      mainfont: "Lora"
      monofont: "JetBrains Mono"
      fontsize: 11pt
      margin:
        top: 0.75in
        bottom: 0.75in
        left: 1in
        right: 1in
      # typst-header.typ must be a HEADER include, not a before-body one: Quarto
      # emits $typst-show.typ$ (which wraps everything in article(), and
      # article() is what renders the outline and the title block) BEFORE
      # $include-before$, so a show rule placed in before-body is scoped inside
      # the body and never matches either of them.
      # _tokens.typ is a HEADER include so its $qmd-* bindings exist before
      # typst-header.typ runs. Those bindings are at the outermost scope, so
      # typst-rules.typ still sees them from inside the body.
      include-in-header:
        - file: _tokens.typ
        - file: typst-header.typ
      include-before-body:
        - file: typst-rules.typ
      highlight-style: a11y
      toc: true
      toc-depth: 3
      number-sections: true
      execute:
        echo: false
        warning: false
        message: false
      knitr:
        opts_chunk:
          fig-format: svg
          dpi: 300
          comment: "#>"
          collapse: true
